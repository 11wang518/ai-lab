<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AI Lab · 本地大模型与 YOLO 工作台</title>
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3.5" y="3.5" width="17" height="17" rx="3"></rect>
        <path d="M8.5 9.5h7M8.5 13h4.5"></path>
        <circle cx="16.8" cy="16.8" r="1.4"></circle>
      </svg>
    </span>
    <div class="brand-text">
      <h1>AI Lab</h1>
      <p>本地大模型 + YOLO 检测</p>
    </div>
  </div>
  <div class="status-cluster">
    <span class="pill" id="llm-pill" title="当前模型后端">
      <span class="dot" id="llm-dot"></span><span id="llm-pill-text">连接中</span>
    </span>
    <span class="pill" id="vision-pill" title="当前检测后端">
      <span class="dot" id="vision-dot"></span><span id="vision-pill-text">检测后端</span>
    </span>
  </div>
</header>

<main class="workspace">
  <section class="pane pane-chat" aria-label="对话">
    <div class="pane-head">
      <h2>对话</h2>
      <div class="pane-actions">
        <select id="provider" class="select" aria-label="模型后端"></select>
        <input id="model" class="input input-model" aria-label="模型名称" spellcheck="false" />
        <label class="switch" title="启用工具调用">
          <input type="checkbox" id="tools" checked />
          <span>工具</span>
        </label>
        <button type="button" class="icon-btn" id="clear-chat" aria-label="清空对话" title="清空对话">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 7h16M9.5 7V5.5A1.5 1.5 0 0 1 11 4h2a1.5 1.5 0 0 1 1.5 1.5V7"></path>
            <path d="M6.5 7l.8 11.2A1.8 1.8 0 0 0 9.1 20h5.8a1.8 1.8 0 0 0 1.8-1.8L17.5 7"></path>
          </svg>
        </button>
      </div>
    </div>

    <div id="transcript" class="transcript" aria-live="polite"></div>

    <form id="composer" class="composer" autocomplete="off">
      <textarea id="prompt" rows="1" placeholder="输入问题，Enter 发送，Shift + Enter 换行"></textarea>
      <div class="composer-foot">
        <span class="hint" id="chat-hint"></span>
        <div class="composer-buttons">
          <button type="button" class="icon-btn" id="stop" aria-label="停止生成" title="停止生成" hidden>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
              <rect x="7" y="7" width="10" height="10" rx="1.6"></rect>
            </svg>
          </button>
          <button type="submit" class="btn btn-primary" id="send">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M4.5 12h13M12 6.5l5.5 5.5L12 17.5"></path>
            </svg>
            发送
          </button>
        </div>
      </div>
    </form>
  </section>

  <section class="pane pane-vision" aria-label="目标检测">
    <div class="pane-head">
      <h2>目标检测</h2>
      <div class="pane-actions">
        <span class="badge" id="engine-badge">未加载</span>
      </div>
    </div>

    <div class="stage-wrap">
      <div class="dropzone" id="dropzone" role="button" tabindex="0" aria-label="选择或拖入图片">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3.5" y="5" width="17" height="14" rx="2.5"></rect>
          <circle cx="9" cy="10" r="1.6"></circle>
          <path d="M4.5 16.5l4-3.5 3.5 3 3-2.5 4.5 3.8"></path>
        </svg>
        <span>拖入图片</span>
      </div>
      <div class="canvas-wrap" id="canvas-wrap" hidden>
        <canvas id="stage"></canvas>
      </div>
    </div>

    <div class="vision-actions">
      <button type="button" class="btn" id="pick">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 16V5M8 9l4-4 4 4"></path>
          <path d="M5 16v2.5A1.5 1.5 0 0 0 6.5 20h11a1.5 1.5 0 0 0 1.5-1.5V16"></path>
        </svg>
        选择图片
      </button>
      <button type="button" class="btn btn-primary" id="detect">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"></path>
          <circle cx="12" cy="12" r="3.2"></circle>
        </svg>
        开始检测
      </button>
      <button type="button" class="btn btn-ghost" id="sample">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M5 5h5v5H5zM14 5h5v5h-5zM5 14h5v5H5zM14 14h5v5h-5z"></path>
        </svg>
        示例图
      </button>
      <button type="button" class="icon-btn" id="clear-image" aria-label="清除图片" title="清除图片">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M6 6l12 12M18 6L6 18"></path>
        </svg>
      </button>
      <input type="file" id="file" accept="image/*" hidden />
    </div>

    <p class="status-line" id="vision-status"></p>

    <div class="results">
      <div class="results-head">
        <span>检测结果</span>
        <span class="count" id="det-count">0</span>
      </div>
      <ul class="det-list" id="det-list"></ul>
    </div>
  </section>
</main>

<script src="/app.js"></script>
</body>
</html>
